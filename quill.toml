# Mail: email for everybody on your server, and your own domain for it.
# A conversation is a thread, a space shared with the people in it; what is
# written in it reaches them as a push and counts as unread until they look.
# Everybody is name@the-cloud, and that mail never leaves the server. An
# administrator can give the server a domain through their own Cloudflare
# account — the settings are on Mail's sheet under Administration › Quills —
# and then everybody is name@that-domain to the world outside as well: mail
# in through Email Routing and a Worker, mail out through Cloudflare's Email
# Service, as the person writing. See CLAUDE.md for the format and the loop.

[quill]
id = "mail"
name = "Mail"
version = "2.4.2"
summary = "Email: an inbox for everybody on your server, name@your-cloud between you, and name@your-own-domain to the world through Cloudflare, set up once by an administrator."
category = "communication"
icon = "envelope"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"
code = "quill.py"
features = [
  "An inbox for everybody: the mails on the left, the open one on the right; send to anybody on the server, offered as you type, or as name@your-cloud; the mail stays on the server, and they get a push",
  "To, Cc and Bcc, with a word of warning when an address is outside the server; conversations as threads, a reply written in a box under the last mail, and what you have not read counted",
  "Inbox, Sent, Archive and Trash, each person's own: archiving a thread hides it for you alone",
  "Your own domain for everybody, through Cloudflare: name@your-domain for each person, mail in through Email Routing and a Worker, mail out through Cloudflare's Email Service",
  "Every setting is an administrator's: the domain is set up once, on Mail's sheet under Administration › Quills; nobody else chooses anything",
  "Everything sealed at rest; the Cloudflare token is a secret, shown to nobody",
  "The same on the web and the phone, in the terminal and on the command line",
]

# Everything Mail keeps is its own: threads, messages, where each person
# filed a thread, and the server's domain. It uses no foundational datamodel.
[uses]
datamodels = []

# -- screens -------------------------------------------------------------------------
# The inbox: a folder's conversations on the left, the open one on the right
# with its messages and a reply box. ?folder= is inbox, sent, archive or
# trash; ?thread= opens one.
[[screens]]
id = "mail"
icon = "envelope"
label = "Mail"
view = "mail"
model = "mail.thread"
# The pen beside the title, as Notes and Tasks have it: a new mail.
compose = { action = "send", label = "New mail" }

# The server's own domain, through Cloudflare: an administrator's alone,
# drawn on Mail's sheet under Administration › Quills and nowhere else.
[[screens]]
id = "settings"
icon = "globe"
label = "Mail domain"
view = "settings"
model = "mail.domain"
admin = true

# -- actions -------------------------------------------------------------------------
[[actions]]
id = "send"
label = "Send"
tone = "primary"
description = "A new mail. To: people on this server, offered as you type, or addresses outside it when the server has a domain."
[actions.fields]
to = { kind = "string", required = true, suggest = "people", outside = "Be aware: you are sending to someone outside this server." }
cc = { kind = "string", label = "Cc", suggest = "people", outside = "Be aware: you are sending to someone outside this server.", extra = true }
bcc = { kind = "string", label = "Bcc", suggest = "people", outside = "Be aware: you are sending to someone outside this server.", extra = true, description = "Each gets a copy of their own; nobody else sees them" }
subject = { kind = "string", required = true }
body = { kind = "text", required = true }

[[actions]]
id = "reply"
label = "Reply"
on = "mail.thread"
tone = "primary"
description = "Answers in this thread: everybody in it reads it, and an outside address gets it from your address on the server's domain."
[actions.fields]
body = { kind = "text", required = true }

[[actions]]
id = "archive"
label = "Archive"
on = "mail.thread"
description = "Takes the thread out of your inbox; it stays in Archive, and comes back when somebody writes."

[[actions]]
id = "trash"
label = "Delete"
on = "mail.thread"
tone = "danger"
description = "Moves the thread to your Trash. Nobody else's copy moves."

[[actions]]
id = "restore"
label = "Move to inbox"
on = "mail.thread"
description = "Back in your inbox."

[[actions]]
id = "delete-forever"
label = "Delete for good"
on = "mail.thread"
confirm = "Delete this thread for everybody in it? It cannot be brought back."
tone = "danger"
description = "Deletes a thread you started, for everybody in it. Only in Trash."

# -- the server's domain, for an administrator ---------------------------------------
# Marked admin: left out of everybody else's Mail, refused to them, and on no
# bar or palette. The Mail domain screen draws their buttons.
[[actions]]
id = "connect"
admin = true
label = "Connect Cloudflare"
tone = "primary"
description = "An API token for the Cloudflare account the domain is on, with five permissions: Zone Read; Email Routing Rules Edit; Workers Scripts Edit; Workers KV Storage Edit; Email Sending Edit. Administrators only."
[actions.fields]
token = { kind = "string", required = true, description = "A Cloudflare API token (My Profile › API Tokens › Custom token) allowed exactly: Zone › Zone › Read, Zone › Email Routing Rules › Edit, Account › Workers Scripts › Edit, Account › Workers KV Storage › Edit, Account › Email Sending › Edit — on the domain's zone and its account" }

[[actions]]
id = "use-domain"
admin = true
label = "Use this domain"
description = "Makes the domain the server's: Email Routing on, a Worker and a KV namespace in your account, every mail for the domain pulled into this server. Administrators only."
[actions.fields]
zone = { kind = "string", required = true, description = "Cloudflare's id for the zone" }

[[actions]]
id = "test-mail"
admin = true
label = "Send a test mail to me"
description = "A mail from your address on the domain to itself: out through Cloudflare, back in through the Worker, in your inbox within two minutes if everything is in place."

[[actions]]
id = "disconnect"
admin = true
label = "Disconnect"
confirm = "Forget the domain and the token? Mail already here stays; the Worker, the namespace and the routing rule stay in your Cloudflare account."
tone = "danger"
description = "The server stops pulling mail and sending from the domain. Administrators only."

# Every minute: what the Worker put in the KV namespace, delivered to whoever it is for.
[[jobs]]
id = "pull"
action = "call"
handler = "pull"
every = "1m"

# -- outside ---------------------------------------------------------------------------
# The only host the code reaches: Cloudflare's API, for the server's own
# domain. The sandbox lets nothing else out.
[[fetch]]
host = "api.cloudflare.com"
why = "to set the server's domain up in your Cloudflare account, pull the mail its Worker took in, and send mail from the domain"
