# A conversation: a space. One between people on the server is shared with
# them, and whoever started it manages it; one with the world outside is its
# owner's alone. The messages are written in it; who last wrote, and what
# each person has not read, is the space's own bookkeeping.

[datamodel]
id = "mail.thread"
version = 3
label = "Thread"
description = "A mail conversation: the people in it, and the messages written in it."
scopes = ["personal", "shared"]
title = "subject"
space = true

[fields]
subject = { kind = "string", required = true }
kind = { kind = "enum", values = ["internal", "external"], labels = ["On this server", "Outside"], default = "internal", indexed = true }
# An outside conversation: the addresses in it besides the owner's, and the
# key the postman names it by (the subject and the outside address), so a
# mail delivered later is drawn with what it answers.
addresses = { kind = "string", description = "The outside addresses in it, with commas between" }
remote = { kind = "string", indexed = true, description = "What names the conversation: the subject and the outside address" }
# The address here it is with.
address = { kind = "email", description = "Your address on the server's domain it came to, or went from" }
