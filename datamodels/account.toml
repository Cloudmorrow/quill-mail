# An account outside the server, somebody's own: where its JMAP session is
# and the token that opens it. The token is a secret: sealed at rest, never
# listed, drawn as dots, and read only by this Quill's code, as its owner.

[datamodel]
id = "mail.account"
version = 1
label = "Account"
description = "A mail account outside the server, read and written through JMAP."
scopes = ["personal"]
title = "name"

[fields]
name = { kind = "string", required = true }
address = { kind = "email", required = true, description = "The address mail from it comes from" }
server = { kind = "url", required = true, description = "The JMAP session address" }
token = { kind = "string", required = true, secret = true, description = "The API token" }
status = { kind = "string", description = "What the last fetch said" }
# Where the provider's API is, which account, its mailboxes and the identity
# to send as: learnt from the session once and kept.
setup = { kind = "json" }
fetched_at = { kind = "datetime", indexed = true, label = "Last fetched" }
